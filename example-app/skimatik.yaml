database:
  dsn: "postgres://postgres:password@localhost:15987/blog?sslmode=disable"
  schema: "public"

output:
  directory: "./internal/repository/generated"
  package: "generated"

# Generate all functions by default
default_functions: "all"

# Generate from SQL query files
queries:
  directory: "./internal/repository/queries"

# Also generate from tables.
#
# `audit: true` opts a parent table into SCD Type 2 history maintained via
# CTE-based Create/Update. The companion `<table>_audit` table must already
# exist in the schema (see migration 000005). See /docs/audit.md for the
# canonical DDL and what gets generated. Delete is generated normally for
# audited tables — whether deletion is permitted is enforced via Postgres
# roles, not by codegen.
tables:
  users:
    audit: true
  posts:
    audit: true
  comments:

verbose: true 