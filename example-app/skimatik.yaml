database:
  dsn: "postgres://postgres:password@localhost:15987/blog?sslmode=disable"
  schema: "public"

output:
  directory: "./internal/repository/generated"
  package: "generated"

# Generate all functions by default
default_functions: "all"

# Generate from SQL query files
queries:
  directory: "./internal/repository/queries"

# `audit: true` opts a parent table into SCD Type 2 history; the companion
# `<table>_audit` table is created in migration 000005. See /docs/audit.md.
tables:
  users:
    audit: true
  posts:
    audit: true
  comments:

verbose: true 