version: "2"
linters:
  disable:
    - errcheck
  enable:
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - unconvert
    - blueprint-vet
  settings:
    custom:
      blueprint-vet:
        type: module
        description: Blueprint conformance rules (R-1..R-7, R-11, R-12)
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
