name: Sync Context7

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  sync:
    name: Sync Documentation to Context7
    runs-on: ubuntu-latest
    steps:
      - name: Refresh Context7 Documentation
        uses: rennf93/upsert-context7@1.1
        with:
          operation: refresh
          timeout: 1800
