name: CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: [ '1.25', '1.26' ]

    steps:
    - uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ matrix.go-version }}

    - name: Cache Go modules
      uses: actions/cache@v5
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ matrix.go-version }}-${{ hashFiles('**/go.sum') }}-v2
        restore-keys: |
          ${{ runner.os }}-go-${{ matrix.go-version }}-v2-

    - name: Download dependencies
      run: go mod download

    - name: Verify dependencies
      run: go mod verify

    - name: Run tests
      run: go test -v -race -parallel=1 ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.25'

    - name: Install golangci-lint
      run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.11.4

    - name: Build custom-gcl (golangci-lint + blueprint-vet plugin)
      run: golangci-lint custom

    - name: Run custom-gcl (skimatik)
      run: ./bin/custom-gcl run --timeout=5m ./...

    - name: Install blueprint-sql-check
      run: go install github.com/nhalm/blueprint-vet/cmd/blueprint-sql-check@v0.2.0

    - name: blueprint-sql-check (example-app queries)
      run: blueprint-sql-check example-app/database/queries

    # custom-gcl on example-app runs in the example-app-integration job,
    # which generates the repository code first. Without that, the package
    # under example-app/internal/repository/generated/ does not exist.

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.25'

    - name: Install Gosec
      run: go install github.com/securego/gosec/v2/cmd/gosec@latest

    - name: Run Gosec Security Scanner
      run: gosec -exclude=G115 ./...
      continue-on-error: true

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, lint]
    steps:
    - uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.25'

    - name: Build
      run: go build -v ./...

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [test, lint]

    steps:
    - uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.25'

    - name: Start database
      run: docker compose -f build/docker-compose.yml up -d postgres

    - name: Wait for database
      run: |
        timeout 30s bash -c 'until docker compose -f build/docker-compose.yml exec -T postgres pg_isready -U skimatik -d skimatik_test; do sleep 1; done'

    - name: Run integration tests
      run: go test -v -tags=integration -parallel=1 ./...
      env:
        TEST_DATABASE_URL: postgres://skimatik:skimatik_test_password@localhost:5432/skimatik_test?sslmode=disable

    - name: Stop database
      if: always()
      run: docker compose -f build/docker-compose.yml down -v

  example-app-integration:
    name: Example App Integration Test
    runs-on: ubuntu-latest
    needs: [test, lint]

    steps:
    - uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.25'

    - name: Cache Go modules
      uses: actions/cache@v5
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-1.25-example-app-${{ hashFiles('**/go.sum') }}-v1
        restore-keys: |
          ${{ runner.os }}-go-1.25-example-app-v1-

    - name: Download dependencies
      run: go mod download

    - name: Run example app tests
      run: make test-example-app

    - name: Clean up
      if: always()
      run: cd example-app && make clean
